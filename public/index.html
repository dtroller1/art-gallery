<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Art Gallery</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #333; line-height: 1.6; }
.container { max-width: 900px; margin: 0 auto; padding: 2rem 1rem; }
h1 { text-align: center; font-size: 32px; margin-bottom: 3rem; font-weight: 400; color: #222; }
.view { display: none; }
.view.active { display: block; }
.artists-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.artist-btn { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 1rem; text-align: center; cursor: pointer; font-size: 15px; font-weight: 500; transition: all 0.15s; }
.artist-btn:hover { border-color: #999; background: #fafafa; }
.painting-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-top: 1.5rem; }
.painting-item { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 0.75rem; cursor: pointer; text-align: center; font-size: 14px; transition: all 0.15s; }
.painting-item:hover { border-color: #999; background: #fafafa; }
.back-btn { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 0.5rem 1rem; cursor: pointer; font-size: 14px; margin-bottom: 1.5rem; }
.back-btn:hover { border-color: #999; background: #fafafa; }
.card { background: white; border: 1px solid #ddd; border-radius: 12px; padding: 2rem; max-width: 700px; margin: 0 auto; }
.card img { width: 100%; border-radius: 8px; cursor: pointer; margin-bottom: 1.5rem; transition: opacity 0.15s; }
.card img:hover { opacity: 0.9; }
.card h2 { font-size: 24px; margin-bottom: 1rem; font-weight: 500; }
.card-meta { display: grid; gap: 12px; margin-bottom: 1.5rem; font-size: 15px; }
.card-meta-row { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding-bottom: 8px; }
.card-meta-row span:first-child { color: #666; }
.story { font-size: 15px; line-height: 1.8; color: #333; white-space: pre-wrap; }
.modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; }
.modal.active { display: flex; }
.modal-content { max-width: 90vw; max-height: 90vh; }
.modal img { width: 100%; height: 100%; object-fit: contain; }
.close-modal { position: fixed; top: 20px; right: 20px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); color: white; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 18px; z-index: 1001; }
.add-btn { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 0.75rem 1.5rem; cursor: pointer; font-size: 15px; margin-top: 2rem; }
.add-btn:hover { border-color: #999; background: #fafafa; }
.form-container { background: white; border: 1px solid #ddd; border-radius: 12px; padding: 2rem; max-width: 600px; margin: 2rem auto; }
.form-group { margin-bottom: 1.5rem; }
.form-group label { display: block; font-weight: 500; margin-bottom: 6px; font-size: 14px; }
.form-group input, .form-group textarea { width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; font-size: 14px; }
.form-group textarea { min-height: 120px; resize: vertical; }
.form-group input:focus, .form-group textarea:focus { outline: none; border-color: #4CAF50; }
.submit-btn { background: #4CAF50; color: white; border: none; border-radius: 8px; padding: 10px 20px; cursor: pointer; font-size: 15px; font-weight: 500; }
.submit-btn:hover { background: #45a049; }
.header-nav { display: flex; gap: 12px; align-items: center; margin-bottom: 1.5rem; }
.header-nav h2 { font-size: 20px; flex: 1; }
.empty-state { text-align: center; padding: 3rem 1rem; color: #666; }
.loading { text-align: center; padding: 2rem; color: #666; }
.error { background: #ffebee; border: 1px solid #ef5350; border-radius: 8px; padding: 1rem; color: #c62828; margin-bottom: 1rem; }
.success { background: #e8f5e9; border: 1px solid #66bb6a; border-radius: 8px; padding: 1rem; color: #2e7d32; margin-bottom: 1rem; }
.image-preview { margin-top: 12px; }
.image-preview img { max-width: 200px; border-radius: 8px; }
</style>
</head>
<body>

<div class="container">
  <h1>My Art Gallery</h1>
  
  <!-- Artists View -->
  <div class="view active" id="artists-view">
    <div id="artists-message"></div>
    <div class="artists-list" id="artists-container"></div>
    <div style="text-align: center; margin-top: 2rem;">
      <button class="add-btn" onclick="showAddForm()">+ Add artwork</button>
    </div>
  </div>

  <!-- Paintings View -->
  <div class="view" id="paintings-view">
    <button class="back-btn" onclick="backToArtists()">← Back to artists</button>
    <h2 id="artist-name-header"></h2>
    <div class="painting-list" id="paintings-container"></div>
  </div>

  <!-- Detail View -->
  <div class="view" id="detail-view">
    <button class="back-btn" onclick="backToPaintings()">← Back</button>
    <div class="card" id="card-container"></div>
  </div>

  <!-- Add Form View -->
  <div class="view" id="form-view">
    <button class="back-btn" onclick="cancelForm()">← Cancel</button>
    <div class="form-container">
      <h2>Add new artwork</h2>
      <div id="form-message"></div>
      <div class="form-group">
        <label>Title</label>
        <input type="text" id="title-input" placeholder="Artwork title">
      </div>
      <div class="form-group">
        <label>Artist</label>
        <input type="text" id="artist-input" placeholder="Artist name">
      </div>
      <div class="form-group">
        <label>Year painted</label>
        <input type="number" id="year-input" placeholder="e.g. 2024">
      </div>
      <div class="form-group">
        <label>Main image (JPG)</label>
        <input type="file" id="image-input" accept=".jpg,.jpeg">
        <div id="image-preview" class="image-preview"></div>
      </div>
      <div class="form-group">
        <label>Story</label>
        <textarea id="story-input" placeholder="Tell the story behind this artwork..."></textarea>
      </div>
      <button class="submit-btn" onclick="saveArtwork()">Save artwork</button>
    </div>
  </div>

  <!-- Image Modal -->
  <div class="modal" id="image-modal" onclick="closeImageModal(event)">
    <button class="close-modal" onclick="closeImageModal()">✕</button>
    <div class="modal-content">
      <img id="modal-image" src="">
    </div>
  </div>
</div>

<script>
const API_URL = '';
let gallery = [];
let currentArtist = null;
let currentArtwork = null;

async function loadGallery() {
  try {
    const response = await fetch(API_URL + '/api/artworks');
    if (!response.ok) throw new Error('Failed to load gallery');
    gallery = await response.json();
    renderArtistsView();
  } catch (error) {
    console.error('Error loading gallery:', error);
    document.getElementById('artists-message').innerHTML = '<div class="error">Failed to load gallery. Please refresh the page.</div>';
  }
}

function getUniqueArtists() {
  const artists = [...new Set(gallery.map(art => art.artist))].sort();
  return artists;
}

function getArtworksByArtist(artist) {
  return gallery.filter(art => art.artist === artist).sort((a, b) => a.title.localeCompare(b.title));
}

function showView(viewId) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(viewId).classList.add('active');
  window.scrollTo(0, 0);
}

function renderArtistsView() {
  const artists = getUniqueArtists();
  const container = document.getElementById('artists-container');
  
  if (artists.length === 0) {
    container.innerHTML = '<div class="empty-state" style="grid-column: 1/-1;">No artworks yet. Add your first piece to get started!</div>';
    return;
  }
  
  container.innerHTML = artists.map(artist => `
    <button class="artist-btn" onclick="viewArtist('${artist.replace(/'/g, "\\'")}')">${artist}</button>
  `).join('');
}

function viewArtist(artist) {
  currentArtist = artist;
  const paintings = getArtworksByArtist(artist);
  const container = document.getElementById('paintings-container');
  document.getElementById('artist-name-header').textContent = artist;
  
  container.innerHTML = paintings.map(painting => `
    <button class="painting-item" onclick="viewDetail(${painting.id})">${painting.title}</button>
  `).join('');
  
  showView('paintings-view');
}

function viewDetail(artworkId) {
  currentArtwork = gallery.find(art => art.id === artworkId);
  const container = document.getElementById('card-container');
  
  container.innerHTML = `
    <img src="${currentArtwork.imageUrl}" onclick="openImageModal(event)" style="cursor: pointer;">
    <h2>${currentArtwork.title}</h2>
    <div class="card-meta">
      <div class="card-meta-row">
        <span>Artist</span>
        <strong>${currentArtwork.artist}</strong>
      </div>
      <div class="card-meta-row">
        <span>Year painted</span>
        <strong>${currentArtwork.year}</strong>
      </div>
    </div>
    <div class="story">${currentArtwork.story}</div>
  `;
  
  showView('detail-view');
}

function backToArtists() {
  showView('artists-view');
}

function backToPaintings() {
  if (currentArtist) {
    viewArtist(currentArtist);
  }
}

function showAddForm() {
  document.getElementById('title-input').value = '';
  document.getElementById('artist-input').value = '';
  document.getElementById('year-input').value = '';
  document.getElementById('image-input').value = '';
  document.getElementById('story-input').value = '';
  document.getElementById('image-preview').innerHTML = '';
  document.getElementById('form-message').innerHTML = '';
  showView('form-view');
}

function cancelForm() {
  showView('artists-view');
}

document.getElementById('image-input')?.addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = function(evt) {
      document.getElementById('image-preview').innerHTML = `<img src="${evt.target.result}">`;
    };
    reader.readAsDataURL(file);
  }
});

async function saveArtwork() {
  const title = document.getElementById('title-input').value.trim();
  const artist = document.getElementById('artist-input').value.trim();
  const year = parseInt(document.getElementById('year-input').value) || new Date().getFullYear();
  const imageInput = document.getElementById('image-input');
  const story = document.getElementById('story-input').value.trim();
  const formMessage = document.getElementById('form-message');
  
  if (!title || !artist || !year || !story || !imageInput.files[0]) {
    formMessage.innerHTML = '<div class="error">Please fill in all fields and select an image.</div>';
    return;
  }
  
  const reader = new FileReader();
  reader.onload = async function(evt) {
    try {
      const response = await fetch(API_URL + '/api/artworks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          title,
          artist,
          year,
          story,
          imageData: evt.target.result
        })
      });
      
      if (!response.ok) throw new Error('Failed to save artwork');
      
      const newArtwork = await response.json();
      gallery.push(newArtwork);
      formMessage.innerHTML = '<div class="success">Artwork saved successfully!</div>';
      setTimeout(() => {
        cancelForm();
        renderArtistsView();
      }, 1000);
    } catch (error) {
      console.error('Error saving artwork:', error);
      formMessage.innerHTML = '<div class="error">Failed to save artwork. Please try again.</div>';
    }
  };
  reader.readAsDataURL(imageInput.files[0]);
}

function openImageModal(e) {
  if (e) e.stopPropagation();
  document.getElementById('modal-image').src = currentArtwork.imageUrl;
  document.getElementById('image-modal').classList.add('active');
}

function closeImageModal(e) {
  if (e && e.target !== document.getElementById('image-modal')) return;
  document.getElementById('image-modal').classList.remove('active');
}

loadGallery();
</script>

</body>
</html>
